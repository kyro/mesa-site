<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- Static fallbacks for crawlers; app.js overwrites these from copy.js (meta.*). -->
<title>Sheaf: a pocket notebook that draws your day</title>
<meta name="description" content="A small e-ink notebook with a pen and a cover. You write on it like paper. Each morning it draws the day's page for you.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sheaf">
<meta property="og:title" content="Sheaf: a pocket notebook that draws your day">
<meta property="og:description" content="A small e-ink notebook with a pen and a cover. You write on it like paper. Each morning it draws the day's page for you.">
<!-- Relative until the domain is decided; most scrapers need an absolute og:image URL. -->
<meta property="og:image" content="img/notebook-open.png">
<meta property="og:image:alt" content="A small e-ink notebook, open in an orange cover, with a pen resting on its handwritten page">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f5f4f0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='4' width='18' height='24' rx='3' fill='%231c1c1a'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="img/notebook-open.webp" type="image/webp" fetchpriority="high">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
<script src="copy.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="draft" id="draft" hidden></div>

<header class="bar">
  <div class="wrap bar-in">
    <a class="wordmark" href="#main" data-c="productName">Sheaf</a>
  </div>
</header>

<main id="main">
  <div id="page">
    <section class="hero wrap" aria-labelledby="h1">
      <div class="hero-txt">
        <p class="eyebrow" data-a="eyebrow"></p>
        <h1 id="h1" tabindex="-1" data-a="headline"></h1>
        <p class="lede" data-a="subhead"></p>
        <form class="signup" id="signup" novalidate data-form="hero"></form>
      </div>
      <figure class="plate hero-img">
        <picture>
          <source srcset="img/notebook-open.webp" type="image/webp">
          <img src="img/notebook-open.png" width="757" height="409" fetchpriority="high" data-alt="images.open" alt="">
        </picture>
        <figcaption class="caption" data-c="images.caption"></figcaption>
      </figure>
    </section>

    <section class="about wrap" aria-labelledby="about-title">
      <figure class="plate about-img">
        <picture>
          <source srcset="img/notebook-closed.webp" type="image/webp">
          <img src="img/notebook-closed.png" width="757" height="418" loading="lazy" decoding="async" data-alt="images.closed" alt="">
        </picture>
        <figcaption class="caption" data-c="images.caption"></figcaption>
      </figure>
      <div class="about-txt">
        <h2 id="about-title" data-c="about.title"></h2>
        <p class="lede" data-c="about.body"></p>
        <ul class="proofs" id="proofs"></ul>
        <p class="hardware" data-c="about.hardware"></p>
      </div>
    </section>

    <section class="repeat wrap" aria-labelledby="repeat-title">
      <h2 id="repeat-title" data-c="signup.repeatTitle"></h2>
      <form class="signup" novalidate data-form="repeat"></form>
    </section>
  </div>

  <section class="thanks wrap" id="thanks" aria-labelledby="thanks-title" hidden>
    <div class="thanks-card">
      <h1 id="thanks-title" tabindex="-1" data-c="thanks.title"></h1>
      <div id="offer">
        <p class="price-line"><span class="sr-only" data-c="price.label"></span><strong class="amount" id="amount"></strong><span aria-hidden="true"> · </span><span id="price-note"></span></p>
        <button type="button" class="btn" id="reserve" data-c="reserve.button"></button>
        <p class="reserve-note" data-c="reserve.note"></p>
        <p><button type="button" class="link" id="skip" data-c="thanks.skip"></button></p>
      </div>
      <p class="skipped" id="skipped" role="status" tabindex="-1" hidden data-c="thanks.skipped"></p>
      <div class="disclosure" id="disclosure" role="status" hidden>
        <h2 id="disclosure-title" tabindex="-1" data-c="disclosure.title"></h2>
        <div id="disclosure-body"></div>
      </div>
    </div>
  </section>
</main>

<footer class="foot wrap">
  <p data-c="footer.text"></p>
  <ul class="foot-links" id="foot-links"></ul>
</footer>

<template id="signup-tpl">
  <div class="field">
    <label class="sr-only"></label>
    <input type="email" name="email" autocomplete="email" inputmode="email" required>
    <button type="submit" class="btn"></button>
  </div>
  <p class="form-error" role="alert" hidden></p>
</template>

<noscript><p class="wrap noscript">This page needs JavaScript to show its content.</p></noscript>
</body>
</html>
